{% extends "base.html" %}

{% block title %}PaperInfo - 数据统计{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-graph-up"></i> 数据统计</h4>
        <a href="/history" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-counterclockwise"></i> 查看历史
        </a>
    </div>

    <!-- KPI 卡片 -->
    <div class="row g-2 mb-3">
        <div class="col-6 col-md-4 col-xl-2">
            <div class="stats-card">
                <div class="stats-number" id="totalPapers">-</div>
                <div class="text-muted small mt-1"><i class="bi bi-file-text"></i> 论文总数</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
            <div class="stats-card">
                <div class="stats-number" id="totalDomains">-</div>
                <div class="text-muted small mt-1"><i class="bi bi-folder"></i> 研究领域</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
            <div class="stats-card">
                <div class="stats-number" id="favoritesCount" style="color: var(--warning);">-</div>
                <div class="text-muted small mt-1"><i class="bi bi-star"></i> 收藏</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
            <div class="stats-card">
                <div class="stats-number" id="weekNew" style="color: var(--success);">-</div>
                <div class="text-muted small mt-1"><i class="bi bi-plus-circle"></i> 本周新增</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
            <div class="stats-card">
                <div class="stats-number" id="avgRelevance" style="color: var(--success);">-</div>
                <div class="text-muted small mt-1"><i class="bi bi-bullseye"></i> 平均相关度</div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-2">
            <div class="stats-card">
                <div class="stats-number" id="avgValue" style="color: var(--info);">-</div>
                <div class="text-muted small mt-1"><i class="bi bi-gem"></i> 平均价值</div>
            </div>
        </div>
    </div>

    <!-- 月度趋势 + 数据源 -->
    <div class="row g-2 mb-3">
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header"><i class="bi bi-graph-up-arrow"></i> 月度发文趋势（最近 12 个月，按发布日期）</div>
                <div class="card-body">
                    <div style="height: 260px;"><canvas id="monthChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header"><i class="bi bi-pie-chart"></i> 数据源分布</div>
                <div class="card-body">
                    <div style="height: 260px; display: flex; justify-content: center;">
                        <canvas id="sourceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 年份 + 评分 + 领域 -->
    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header"><i class="bi bi-bar-chart"></i> 年份分布</div>
                <div class="card-body">
                    <div style="height: 240px;"><canvas id="yearChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header"><i class="bi bi-bar-chart-steps"></i> 相关度评分分布</div>
                <div class="card-body">
                    <div style="height: 240px;"><canvas id="scoreChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header"><i class="bi bi-diagram-3"></i> 研究领域分布</div>
                <div class="card-body">
                    <div style="height: 240px; display: flex; justify-content: center;">
                        <canvas id="domainChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 领域明细 -->
    <div class="card">
        <div class="card-header"><i class="bi bi-list-columns"></i> 领域明细</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>领域</th>
                            <th class="text-end">论文数</th>
                            <th class="text-end">arXiv</th>
                            <th class="text-end">DBLP</th>
                            <th class="text-end">S2</th>
                            <th class="text-end">平均相关度</th>
                            <th class="text-end">平均价值</th>
                            <th class="text-end">状态</th>
                        </tr>
                    </thead>
                    <tbody id="domainTable">
                        <tr><td colspan="8" class="text-center text-muted py-3">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// 与全站一致的主题色
const THEME = {
    primary: '#2563eb',
    success: '#16a34a',
    info:    '#0284c7',
    warning: '#d97706',
    danger:  '#dc2626',
    purple:  '#7c3aed',
    pink:    '#db2777'
};
const PALETTE = [THEME.primary, THEME.success, THEME.info, THEME.warning, THEME.purple, THEME.pink, THEME.danger];

let monthChart, sourceChart, yearChart, scoreChart, domainChart;

async function loadStats() {
    try {
        const response = await fetch('/api/stats');
        const data = await response.json();

        // KPI
        document.getElementById('totalPapers').textContent = data.total_papers;
        document.getElementById('totalDomains').textContent = data.total_domains;
        document.getElementById('favoritesCount').textContent = data.favorites_count ?? 0;
        document.getElementById('weekNew').textContent = '+' + (data.week_new ?? 0);
        document.getElementById('avgRelevance').textContent = data.avg_relevance ?? '—';
        document.getElementById('avgValue').textContent = data.avg_value ?? '—';

        drawMonthChart(data.by_month || {});
        drawSourceChart(data.by_source || {});
        drawYearChart(data.by_year || {});
        drawScoreChart(data.score_distribution || {});
        if (data.domains && data.domains.length > 0) {
            drawDomainChart(data.domains);
            fillDomainTable(data.domains);
        } else {
            document.getElementById('domainTable').innerHTML =
                '<tr><td colspan="8" class="text-center text-muted py-3">暂无领域数据</td></tr>';
        }
    } catch (error) {
        console.error('加载统计数据失败:', error);
        document.getElementById('domainTable').innerHTML =
            '<tr><td colspan="8" class="text-center text-muted py-3">加载失败，请刷新重试</td></tr>';
    }
}

// 月度发文趋势（折线图）
function drawMonthChart(monthData) {
    const ctx = document.getElementById('monthChart').getContext('2d');
    if (monthChart) monthChart.destroy();

    const labels = Object.keys(monthData);
    const data = labels.map(m => monthData[m]);

    monthChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '论文数量',
                data: data,
                borderColor: THEME.primary,
                backgroundColor: 'rgba(37, 99, 235, 0.08)',
                fill: true,
                tension: 0.35,
                pointRadius: 3,
                pointBackgroundColor: THEME.primary,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } },
                x: { ticks: { maxRotation: 45 } }
            },
            plugins: { legend: { display: false } }
        }
    });
}

// 数据源分布（环形图）
function drawSourceChart(sourceData) {
    const ctx = document.getElementById('sourceChart').getContext('2d');
    if (sourceChart) sourceChart.destroy();

    const labels = [];
    const data = [];
    for (const [source, count] of Object.entries(sourceData)) {
        labels.push(source.toUpperCase());
        data.push(count);
    }

    sourceChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: PALETTE.slice(0, labels.length),
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
        }
    });
}

// 年份分布（柱状图）
function drawYearChart(yearData) {
    const ctx = document.getElementById('yearChart').getContext('2d');
    if (yearChart) yearChart.destroy();

    const sortedYears = Object.keys(yearData).sort();
    const data = sortedYears.map(year => yearData[year]);

    yearChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: sortedYears,
            datasets: [{
                label: '论文数量',
                data: data,
                backgroundColor: THEME.primary,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
            plugins: { legend: { display: false } }
        }
    });
}

// 相关度评分分布（柱状图，分档着色）
function drawScoreChart(scoreData) {
    const ctx = document.getElementById('scoreChart').getContext('2d');
    if (scoreChart) scoreChart.destroy();

    const labels = Object.keys(scoreData);
    const data = labels.map(k => scoreData[k]);
    const colors = ['#9ca3af', '#d97706', '#eab308', '#84cc16', '#16a34a'];

    scoreChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: '论文数量',
                data: data,
                backgroundColor: colors.slice(0, labels.length),
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
            plugins: { legend: { display: false } }
        }
    });
}

// 研究领域分布（环形图）
function drawDomainChart(domains) {
    const ctx = document.getElementById('domainChart').getContext('2d');
    if (domainChart) domainChart.destroy();

    const labels = domains.map(d => d.name);
    const data = domains.map(d => d.total);
    // 与后端 domain_color 一致：同一领域在徽章/饼图/明细表中同色
    const colors = domains.map((d, i) => d.color || PALETTE[i % PALETTE.length]);

    domainChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom' },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                            const pct = total > 0 ? ((context.parsed / total) * 100).toFixed(1) : 0;
                            return `${context.label}: ${context.parsed} 篇 (${pct}%)`;
                        }
                    }
                }
            }
        }
    });
}

// 领域明细表
function fillDomainTable(domains) {
    const tbody = document.getElementById('domainTable');
    tbody.innerHTML = domains.map(d => `
        <tr>
            <td><span class="domain-dot" style="background:${d.color || '#475569'}"></span><a href="/?domain=${d.id}" class="text-decoration-none fw-medium">${d.name}</a></td>
            <td class="text-end fw-bold">${d.total}</td>
            <td class="text-end">${d.by_source.arxiv || 0}</td>
            <td class="text-end">${d.by_source.dblp || 0}</td>
            <td class="text-end">${d.by_source.s2 || 0}</td>
            <td class="text-end">${d.avg_relevance !== null ? `<span class="badge bg-success">${d.avg_relevance}</span>` : '—'}</td>
            <td class="text-end">${d.avg_value !== null ? `<span class="badge bg-info">${d.avg_value}</span>` : '—'}</td>
            <td class="text-end">${d.enabled ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">停用</span>'}</td>
        </tr>
    `).join('');
}

document.addEventListener('DOMContentLoaded', loadStats);
</script>
{% endblock %}
